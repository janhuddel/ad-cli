name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        id: check
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ad-cli") | .version')
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: x86_64-windows
          # Linux release build disabled for now (only Windows is needed, saves
          # pipeline time). Re-enable by uncommenting:
          # - target: x86_64-unknown-linux-musl
          #   os: ubuntu-latest
          #   platform: x86_64-linux
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: ad-${{ needs.verify-version.outputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:ARCHIVE | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ad.exe", README.md, LICENSE, CHANGELOG.md $env:ARCHIVE
          Compress-Archive -Path $env:ARCHIVE -DestinationPath "$env:ARCHIVE.zip"
          Copy-Item "target/${{ matrix.target }}/release/ad.exe" "$env:ARCHIVE.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/ad" README.md LICENSE CHANGELOG.md "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/ad" "$ARCHIVE"-bin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}.zip
            ${{ env.ARCHIVE }}.exe
            ${{ env.ARCHIVE }}.tar.gz
            ${{ env.ARCHIVE }}-bin
          if-no-files-found: error

  release:
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Name raw Linux binary and write checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          for f in *-bin; do mv "$f" "${f%-bin}"; done
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: ad-cli ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
