[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# One version for both tools: they're released together from this repo.
version = "2.0.0"
edition = "2021"
authors = ["Jan Rohwer"]
license = "MIT"
repository = "https://github.com/janhuddel/ad-cli"

[workspace.dependencies]
ldap-cli-core = { path = "crates/ldap-cli-core" }
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
# No TLS feature here: ldap-cli-core picks the backend per platform.
ldap3 = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
toml = "0.8"
comfy-table = "8.0"
console = "0.16"
dialoguer = "0.12"
chrono = "0.4"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }
dirs = "5"
crossterm = "0.29"
fuzzy-matcher = "0.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
