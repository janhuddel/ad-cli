[package]
name = "ad-cli"
version = "0.1.0-beta.3"
edition = "2021"
description = "Query Active Directory user details and group memberships over LDAPS"
authors = ["Jan Rohwer"]
license = "MIT"
repository = "https://github.com/janhuddel/ad-cli"
readme = "README.md"

[[bin]]
name = "ad"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
toml = "0.8"
comfy-table = "8.0"
console = "0.16"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
chrono = "0.4"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
